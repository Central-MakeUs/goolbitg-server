  /api/v1/challengeGroups/{groupId}/exit:
    post:
      summary: 챌린지 그룹 나가기
      operationId: exitChallengeGroup
      description: 챌린지 그룹에서 나갑니다.
      tags:
        - ChallengeGroup
      parameters:
        - $ref: '#/components/parameters/groupIdParam'
      responses:
        '200':
          description: 나가기에 성공했습니다.
        '422':
          description: 챌린지 그룹 나가기 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
              examples:
                참여중이지 않은 챌린지:
                  $ref: '#/components/examples/Error_NotEnrolled'
                존재하지 않는 챌린지:
                  $ref: '#/components/examples/Error_ChallengeNotExist'

  /api/v1/buyOrNots:
    get:
      summary: 살까말까 포스트 목록 가져오기
      operationId: getBuyOrNots
      description: >
        살까말까 포스트 목록을 최신순으로 가져옵니다.<br><br>
        목록에는 개인화가 적용될 수 있습니다.
      tags:
        - BuyOrNot
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/sizeParam'
        - name: created
          description: 내가 작성한 포스트만 가져올지 여부입니다.
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 살까말까 포스트 최신순 목록 가져오기
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBuyOrNotDto'
    post:
      summary: 살까말까 포스트 등록하기
      operationId: createBuyOrNot
      description: 살까말까 포스트를 등록합니다.
      tags:
        - BuyOrNot
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuyOrNotDto'
            examples:
              일반:
                $ref: '#/components/examples/BuyOrNot_Form_Normal'
      responses:
        '201':
          description: 살까말까 포스트 등록 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuyOrNotDto'
        '422':
          description: 살까말까 등록 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
              examples:
                등록 한도 초과:
                  $ref: '#/components/examples/Error_PostLimitExceed'
  /api/v1/buyOrNots/{postId}:
    put:
      summary: 살까말까 포스트 수정하기
      operationId: updateBuyOrNot
      description: 살까말까 포스트를 수정합니다.
      tags:
        - BuyOrNot
      parameters:
        - $ref: '#/components/parameters/postIdParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuyOrNotDto'
            examples:
              일반:
                $ref: '#/components/examples/BuyOrNot_Form_Modify'
      responses:
        '200':
          description: 살까말까 수정 완료. 수정된 정보를 반환합니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuyOrNotDto'
        '422':
          description: 살까말까 수정 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
              examples:
                존재하지 않는 포스트:
                  $ref: '#/components/examples/Error_PostNotExist'
    get:
      summary: 특정 살까말까 포스트 정보 확인
      operationId: getBuyOrNot
      description: 특정 살까말까 포스트의 정보를 확인합니다.
      tags:
        - BuyOrNot
      parameters:
        - $ref: '#/components/parameters/postIdParam'
      responses:
        '200':
          description: 특정 살까말까 정보 반환
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuyOrNotDto'
        '422':
          description: 살까말까 수정 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
              examples:
                존재하지 않는 포스트:
                  $ref: '#/components/examples/Error_PostNotExist'
    delete:
      summary: 살까말까 포스트 삭제
      operationId: deleteBuyOrNot
      description: 특정 살까말까 포스트를 삭제합니다.
      tags:
        - BuyOrNot
      parameters:
        - $ref: '#/components/parameters/postIdParam'
      responses:
        '200':
          description: 살까말까 제거 완료
        '422':
          description: 살까말까 수정 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
              examples:
                존재하지 않는 포스트:
                  $ref: '#/components/examples/Error_PostNotExist'
  /api/v1/buyOrNots/{postId}/report:
    post:
      summary: 살까말까 포스트 신고
      operationId: buyOrNotReport
      description: 살까말까 포스트를 신고합니다.
      tags:
        - BuyOrNot
      parameters:
        - $ref: '#/components/parameters/postIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: 신고 사유
              required: 
                - reason
      responses:
        '200':
          description: 살까말까 신고 완료
        '422':
          description: 살까말까 신고 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
              examples:
                존재하지 않는 포스트:
                  $ref: '#/components/examples/Error_PostNotExist'
                이미 신고한 포스트:
                  $ref: '#/components/examples/Error_PostAlreadyReported'
  /api/v1/buyOrNots/{postId}/vote:
    post:
      summary: 살까말까 투표
      operationId: voteBuyOrNot
      description: 특정 살까말까 포스트에 투표합니다.
      tags:
        - BuyOrNot
      parameters:
        - $ref: '#/components/parameters/postIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuyOrNotVoteDto'
      responses:
        '200':
          description: >
            살까말까 투표 완료<br><br>
            투표 완료후 투표수를 반환합니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuyOrNotVoteChangeDto'
        '422':
          description: 살까말까 투표 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
              examples:
                내가 작성한 포스트:
                  $ref: '#/components/examples/Error_CannotVoteMyPost'
  /api/v1/buyOrNots/{postId}/chat/history:
    get:
      summary: 살까말까 채팅방 기록
      operationId: chatHistory
      description: 살까말까 채팅방의 기록을 가져옵니다.
      tags:
        - BuyOrNot
      parameters:
        - $ref: '#/components/parameters/postIdParam'
        - $ref: '#/components/parameters/chatLastIdParam'
      responses:
        '200':
          description: >
            채팅 기록을 가져옵니다.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatMessageDto'
  /api/v1/buyOrNots/chat/list:
    get:
      summary: 참여중인 채팅방 리스트
      operationId: chatList
      description: 참여중인 살까말까 채팅방 리스트를 가져옵니다.
      tags:
        - BuyOrNot
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/sizeParam'
      responses:
        '200':
          description: 참여중인 살까말까 포스트 최신순 목록 가져오기
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBuyOrNotDto'


  /api/v1/analysis/report:
    get:
      summary: 소비습관 분셕결과
      operationId: getAnalysisReport
      description: 유저의 소비습관 분석결과를 조회합니다.
      tags:
        - Analysis
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisReportDto'

  /api/v1/notices:
    get:
      summary: 내 알림 목록 가져오기
      operationId: getNotices
      description: >
        내 알림 목록을 가져옵니다.<br><br>
        알림은 첫 생성 이후 30일이 지나면 자동으로 삭제됩니다.
      tags:
        - Notice
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/sizeParam'
        - name: type
          description: 필터링할 알림의 타입입니다. 제공되지 않으면 모든 타입을 가져옵니다.
          in: query
          schema:
            $ref: '#/components/schemas/NoticeType'
      responses:
        '200':
          description: 내 알림 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNoticeDto'
  /api/v1/notices/{noticeId}:
    post:
      summary: 알림 읽음표시하기
      operationId: readNotice
      description: 특정 알림을 읽음표시합니다.
      tags:
        - Notice
      parameters:
        - name: noticeId
          description: 읽음표시할 알림 ID입니다.
          in: path
          required: true
          schema:
            type: integer
            format: int64
            default: 0
      responses:
        '200':
          description: 읽음 표시 완료
        '422':
          description: 알림 읽음표시 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
              examples:
                존재하지 않는 알림:
                  $ref: '#/components/examples/Error_NoticeNotExist'
                이미 읽음표시 됨:
                  $ref: '#/components/examples/Error_AlreadyRead'

components:
  schemas:
    ImageUploadResponse:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: 업로드한 이미지 url
    PaginatedNoticeDto:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponseDto'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/NoticeDto'
    ChallengeGroupRecordCreationDto:
      type: object
      properties:
        groupId:
          type: integer
          format: int64
    PaginatedChallengeGroupRecordDto:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponseDto'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ChallengeGroupDto'
    PaginatedChallengeGroupDto:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponseDto'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ChallengeGroupDto'
    ChallengeRecordCreationDto:
      type: object
      properties:
        challengeId:
          type: integer
          format: int64
    PaginatedChallengeRecordDto:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponseDto'
        - type: object
          properties:
            totalReward:
              type: integer
              description: 총 챌린지 리워드
            items:
              type: array
              items:
                $ref: '#/components/schemas/ChallengeRecordDto'
    PaginatedBuyOrNotDto:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponseDto'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/BuyOrNotDto'
    PaginatedChallengeDto:
      allOf:
        - $ref: '#/components/schemas/PaginatedResponseDto'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ChallengeDto'
    UserDto:
      type: object
      properties:
        id:
          type: string
          description: 사용자 고유 ID값, 랜덤 생성
        nickname:
          type: string
          minimum: 2
          maximum: 6
          description: 한글, 영문 대소문자만 입력 가능
        birthday:
          type: string
          format: date
          description: 생일
        gender:
          $ref: '#/components/schemas/Gender'
        check1:
          type: boolean
          description: 체크리스트 1 체크 여부
        check2:
          type: boolean
          description: 체크리스트 2 체크 여부
        check3:
          type: boolean
          description: 체크리스트 3 체크 여부
        check4:
          type: boolean
          description: 체크리스트 4 체크 여부
        check5:
          type: boolean
          description: 체크리스트 5 체크 여부
        check6:
          type: boolean
          description: 체크리스트 6 체크 여부
        avgIncomePerMonth:
          type: integer
          description: 월간 평균 수입
        avgSpendingPerMonth:
          type: integer
          description: 월간 평균 지출
        primeUseDay:
          type: string
          format: day
          description: 주 지출 요일
        primeUseTime:
          type: string
          description: 주 지출 시간
        spendingType:
          $ref: '#/components/schemas/SpendingTypeDto'
        spendingHabitScore:
          type: integer
          minimum: 0
          maximum: 100
          description: 소비습관 점수 (0 ~ 100점)
        challengeCount:
          type: integer
          description: 총 챌린지 참여 개수
        postCount:
          type: integer
          description: 총 작성글 수
        achievementGuage:
          type: integer
          description: 달성 게이지
      required:
        - id
        - nickname
        - birthday
        - gender
        - check1
        - check2
        - check3
        - check4
        - check5
        - check6
        - spendingType
        - spendingHabitScore
        - avgIncomePerMonth
        - avgSpendingPerMonth
        - challengeCount
        - postCount
        - achievementGuage
      example:
        id: "id0001"
        nickname: 굴비왕
        birthday: "1999-03-01"
        gender: MALE
        check1: false
        check2: true
        check3: true
        check4: false
        check5: true
        check6: true
        avgIncomePerMonth: 3600000
        avgSpendingPerMonth: 2000000
        primeUseDay: "FRIDAY"
        primeUseTime: "20:00:00"
        spendingHabitScore: 62
        spendingType:
          id: 1
          title: 자린고비 굴비
          imageUrl: http://localhost:8080/image/st1
          profileUrl: http://localhost:8080/image/st1
          onboardingResultUrl: http://localhost:8080/image/st1
          goal: 20000
          peopleCount: 20
        challengeCount: 14
        postCount: 4
        achievementGuage: 2000
    UserRegisterStatusDto:
      type: object
      properties:
        status:
          type: integer
          minimum: 0
          maximum: 6
          description: 회원정보 입력 상태 (0 ~ 6)
        requiredInfoCompleted:
          type: boolean
          description: 필수정보 입력 완료 여부
    UnregisterDto:
      type: object
      properties:
        reason:
          type: string
          description: 탈퇴 사유
        authorizationCode:
          type: string
          description: 탈퇴할 회원의 Authorization Code. Apple 로그인 전용.
      required:
        - reason
      example:
        reason: 앱을 자주 사용하지 않아요
        authorizationCode: <authorization_code>
    UserWeeklyStatusDto:
      type: object
      properties:
        nickname:
          type: string
          description: 사용자 닉네임
        saving:
          type: integer
          description: 주간 아낀 금액
        continueCount:
          type: integer
          description: 연속 달성 일수 (전체)
        weeklyStatus:
          type: array
          items:
            $ref: '#/components/schemas/UserDailyStatusDto'
          description: 주간 성공 기록
        todayIndex:
          type: integer
          minimum: 0
          maximum: 6
          description: 오늘 위치 (0 ~ 6)
      example:
        nickname: 바쁜굴비
        saving: 50000
        continueCount: 3
        weeklyStatus:
          - totalChallenges: 5
            achievedChallenges: 5
          - totalChallenges: 5
            achievedChallenges: 5
          - totalChallenges: 5
            achievedChallenges: 3
          - totalChallenges: 5
            achievedChallenges: 0
          - totalChallenges: 3
            achievedChallenges: 0
          - totalChallenges: 3
            achievedChallenges: 0
          - totalChallenges: 0
            achievedChallenges: 0
        todayIndex: 3
    UserDailyStatusDto:
      type: object
      properties:
        totalChallenges:
          type: integer
          description: 달성해야 할 총 챌린지 개수
        achievedChallenges:
          type: integer
          description: 달성한 총 챌린지 개수
    SpendingTypeDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: 소비유형 ID
        title:
          type: string
          description: 소비유형 이름
        imageUrl:
          type: string
          format: uri
          description: 소비유형 대표 이미지
        profileUrl:
          type: string
          format: uri
          description: 소비유형 프로필 이미지
        onboardingResultUrl:
          type: string
          format: uri
          description: 소비유형 분석결과 이미지
        goal:
          type: integer
          description: 다음 단계까지 남은 금액
        peopleCount:
          type: integer
          description: 소비유형 사람 수
      example:
        id: 1
        title: 자린고비 굴비
        imageUrl: http://localhost:8080/image/st1
        profileUrl: http://localhost:8080/image/st1
        onboardingResultUrl: http://localhost:8080/image/st1
        goal: 20000
        peopleCount: 20
    ChallengeGroupStatDto:
      type: object
      properties:
        groupId:
          type: integer
          format: int64
          description: 챌린지 그룹 ID
        userId:
          type: string
          description: 유저 ID
        continueCount:
          type: integer
          description: 연속 달성 일수
        totalCount:
          type: integer
          description: 총 달성 일수
        enrollCount:
          type: integer
          description: 참여 회수
      example:
        groupId: 0
        userId: "id0001"
        continueCount: 12
        totalCount: 15
        enrollCount: 6
    ChallengeGroupRecordDto:
      type: object
      properties:
        challengeGroupId:
          type: integer
          format: int64
          description: 챌린지 그룹 ID
        userId:
          type: string
          description: 유저 ID
        date:
          type: string
          format: date
          description: 기록 날짜
        status:
          $ref: '#/components/schemas/ChallengeRecordStatus'
    ChallengeGroupDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: 챌린지 그룹 ID
        ownerId:
          type: string
          description: 챌린지 생성자
        title:
          type: string
          description: 챌린지 제목
        reward:
          type: integer
          description: 챌린지 금액
        hashtags:
          type: array
          items:
            type: string
          description: 해시태그 목록
        category:
          type: string
          description: 카테고리
        maxSize:
          type: integer
          minimum: 2
          maximum: 10
          description: 최대 인원
        peopleCount:
          type: integer
          description: 참여 인원수
        isHidden:
          type: boolean
          description: 비밀방 여부
          default: false
        password:
          type: string
          minimum: 4
          maximum: 4
          description: 비밀번호
        avgAchieveRatio:
          type: number
          format: float
          description: 평균 달성 비율
        maxAchieveDays:
          type: integer
          description: 최대 달성일
      example:
        id: 0
        ownerId: id0001
        title: 배달음식 안시켜먹기
        hashtags: [ "배달", "음식" ]
        reward: 5000
        category: "식비"
        maxSize: 6
        peopleCount: 1
        avgAchieveRatio: 4.5
        maxAchieveDays: 9
        isHidden: false
    ChallengeGroupRankDto:
      type: object
      properties:
        group:
          $ref: '#/components/schemas/ChallengeGroupDto'
        rank:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: 사용자 이름
                example: 왕굴비
              profileUrl:
                type: string
                description: 프로필 이미지 url
                example: http://example.url/profile
              saving:
                type: integer
                description: 절약 금액
                example: 25000
    ChallengeGroupEnrollmentDto:
      type: object
      properties:
        password:
          type: string
          example: '1234'
    ChallengeGroupTrippleDto:
      type: object
      properties:
        duration:
          type: integer
          example: 7
          description: 오늘이 몇 번째 연속 도전중일인지 나타내는 수
        check1:
          $ref: '#/components/schemas/ChallengeRecordStatus'
        check2:

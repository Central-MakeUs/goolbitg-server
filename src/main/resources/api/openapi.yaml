openapi: 3.0.3

info:
  title: 🎣 굴비잇기 API 서버
  description: >
    굴비잇기 프로젝트의 API 서버입니다.

    ## 📣 응답

    `200`번대 응답은 성공했을 때의 응답으로, 엔드포인트에 따라 바디가 있을 수도,
    없을 수도 있습니다.
    <br><br>
    `400`번대 응답은 `422 Unprocessable Entity`를 제외하고는 모든 엔드포인트에
    적용되는 공통 에러 응답입니다. <br>따라서 중복을 막기 위해 `/health` 엔드포인트를
    제외하고는 응답란에서 제외시켰습니다.


    ## ⛔️ 에러코드

    에러코드는 4자리 숫자로 구성되며, 앞 2자리는 그룹을, 뒷 2자리는 그룹 내 구분자
    역할을 합니다. <br>
    예를 들어, `1002`는 10번 그룹 2번째 에러를 의미합니다.<br><br>

    자세한 에러코드 및 메시지 정보는 **아래 링크👇**에서 확인할 수 있습니다. <br>
    [에러코드 목록](https://github.com/Central-MakeUs/goolbitg-server/blob/spec/v1/docs/errors.md)
  termsOfService: http://localhost:8080/terms-of-service
  version: 1.0.3

servers:
  - url: https://dev.goolbitg.site
    description: 개발 서버
  - url: https://api.goolbitg.site
    description: 메인 서버
  - url: http://localhost:8080
    description: 로컬호스트 서버

paths:
  /api/v1/health:
    get:
      summary: 서버 상태 체크
      operationId: checkHealth
      description: 서버의 상태를 체크합니다.
      tags:
        - ETC
      responses:
        '200':
          description: 서버 상태 좋음
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/images:
    post:
      summary: 이미지 업로드
      operationId: uploadImage
      description: 이미지를 업로드합니다.
      tags:
        - ETC
      requestBody:
        required: true
        description: 업로드할 이미지입니다.
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
              required:
                - image
            encoding:
              image:
                contentType: image/*
      responses:
        '201':
          description: 업로드 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageUploadResponse'
        '422':
          description: 업로드 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
              examples:
                허용되지 않은 이미지 타입:
                  $ref: '#/components/examples/Error_ImageTypeNotAllowed'
                너무 큰 이미지:
                  $ref: '#/components/examples/Error_ImageSizeTooHuge'
  /api/v1/token:
    get:
      summary: 루트 유저 엑세스 토큰 발급
      operationId: getRootAccess
      description: 루트 유저의 엑세스 토큰을 발급합니다. 테스트용입니다.
      tags:
        - ETC
      responses:
        '200':
          description: 엑세스 토큰 발급 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponseDto'
  /api/v1/admin/sendChallengeNotice:
    post:
      summary: 미완료 챌린지 안내 알림 전송
      operationId: sendChallengeNotice
      description: > 
        미완료 챌린지를 안내하는 알림을 모든 유저에게 전송합니다.
        <br><br>
        admin password를 제공해야 합니다.
      tags:
        - ETC
      parameters:
        - name: password
          description: admin password
          required: true
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 알림 전송 성공
  /api/v1/auth/register:
    post:
      summary: 회원가입
      operationId: register
      description: >
        외부 인증서버로부터 얻은 id 토큰을 이용해 사용자를 등록합니다.

        ### 인증 타입

        - `KAKAO`: 카카오 로그인

        - `APPLE`: 애플 로그인

        ### 회원가입 절차

        1. 회원가입 요청이 성공했다면, 같은 인증 정보로 로그인합니다.

        2. 회원 정보 입력이 완료되지 않았기 때문에 로그인 요청은 
          `registerComplete: false` 와 함께 다음 회원 정보 
          입력을 위한 url을 반환합니다.

        3. 로그인 시 반환된 엑세스 토큰과 함께 회원정보 입력 요청을 수행합니다.

        4. 필수 정보들의 입력이 완료되면 다른 API 요청들이 정상적으로 반환됩니다.
      tags:
        - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequestDto'
      responses:
        '201':
          description: 회원가입 성공
        '422':
          description: 회원가입 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
              examples:
                이미 등록된 회원:
                  $ref: '#/components/examples/Error_AlreadyRegistered'
                유효하지 않은 토큰:
                  $ref: '#/components/examples/Error_TokenNotValid'
  /api/v1/auth/login:
    post:
      summary: 로그인
      operationId: login
      description: >
        외부 인증서버로부터 얻은 id 토큰을 이용해 로그인합니다.

        ### 인증 타입

        - `KAKAO`: 카카오 로그인

        - `APPLE`: 애플 로그인
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequestDto'
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponseDto'
              examples:
                카카오 로그인:
                  $ref: '#/components/examples/LoginRequest_KAKAO'
        '422':
          description: 로그인 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
              examples:
                유효하지 않은 토큰:
                  $ref: '#/components/examples/Error_TokenNotValid'
                등록되지 않은 회원:
                  $ref: '#/components/examples/Error_NotRegistered'
  /api/v1/auth/refresh:
    post:
      summary: 엑세스 토큰 재발급
      operationId: refresh
      description: >
        엑세스 토큰을 재발급합니다.

        ### 토큰 기한
        
        - access token: 1일

        - refresh token: 30일
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequestDto'
      responses:
        '200':
          description: >
            엑세스 토큰 재발급 성공<br><br>
            NOTE: 리프레시 토큰의 기한이 10일 이내로 남았다면 리프레시 토큰 또한
            재발급됩니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponseDto'
        '422':
          description: 토큰 재발급 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
              examples:
                유효하지 않은 토큰:
                  $ref: '#/components/examples/Error_TokenNotValid'
                토큰 기한 만료:
                  $ref: '#/components/examples/Error_TokenExpired'
  /api/v1/auth/logout:
    post:
      summary: 로그아웃
      operationId: logout
      description: 현재 로그인한 유저를 로그아웃 합니다.
      tags:
        - Auth
      responses:
        '200':
          description: 로그아웃 성공
        '422':
          description: 로그아웃 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
              examples:
                유효하지 않은 토큰:
                  $ref: '#/components/examples/Error_TokenNotValid'
                토큰 기한 만료:
                  $ref: '#/components/examples/Error_TokenExpired'
  /api/v1/auth/unregister:
    post:
      summary: 회원 탈퇴
      operationId: unregister
      description: > 
        회원을 탈퇴합니다.<br><br>
        현재 로그인된 상태여야 합니다.<br><br>
        탈퇴시 사유를 등록해야 합니다.<br><br>
        애플 로그인 사용자는 추가로 authorization code를 제출해야 합니다.
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnregisterDto'
      responses:
        '200':
          description: 회원탈퇴 완료
        '422':
          description: 회원탈퇴 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
              examples: 
                인가코드 없음:
                  $ref: '#/components/examples/Error_AuthorizationCodeNotExist'
                APPLE 로그인 인증 오류:
                  $ref: '#/components/examples/Error_AppleLoginAuthError'

  /api/v1/users/me:
    get:
      summary: 현재 로그인한 유저 정보 반환
      operationId: getMyInfo
      description: 현재 로그인한 유저 정보를 반환합니다.
      tags:
        - User
      responses:
        '200':
          description: 현재 로그인한 유저 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
  /api/v1/users/me/registerStatus:
    get:
      summary: 회원정보 입력 상태 반환
      description: >
        응답으로 반환되는 `status` 필드는 현재까지 완료된 유저 정보의 번호입니다.<br>
        0~5까지 있으며, 0이면 아무것도 입력되지 않은 상태, 5이면 5번 정보까지 입력된
        상태, 즉, 모두 입력된 상태입니다. 이 값을 이용해서 다음에 호출해야 할 유저 정보
        입력 API가 무엇인지 알아낼 수 있습니다.<br>만약 1이 반환된다면 2번째 정보 입력
        API를 호출하면 됩니다.<br>
        각 정보 입력 API의 순서는 API 설명 옆에 적혀있습니다. (예: 1. 약관동의 정보 등록)<br>
        마지막 6번 정보는 챌린지 하나를 등록하는 것입니다. 하나라도 등록된 챌린지가
        있다면 완료된 것으로 간주합니다.
        <br><br>
        `requiredInfoCompleted` 필드는 필수로 입력해야 할 정보가 모두 입력되었는지를
        나타냅니다. 만약 이 필드값이 true라면 나머지 정보는 필수 입력 사항이 아님을
        의미합니다.
      operationId: getRegisterStatus
      tags:
        - User
      responses:
        '200':
          description: 회원정보 입력 상태 반환
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRegisterStatusDto'
  /api/v1/users/me/weeklyStatus:
    get:
      summary: 주간 기록 보기
      description: > 
        주간 기록 통계를 반환합니다.<br><br>
        홈 페이지와 챌린지 페이지 상단 뷰에 필요한 정보입니다.
      operationId: getWeeklyStatus
      tags:
        - User
      parameters:
        - $ref: '#/components/parameters/dateParam'
      responses:
        '200':
          description: 주간 기록 반환
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserWeeklyStatusDto'
  /api/v1/users/nickname/check:
    post:
      summary: 닉네임 중복 체크
      operationId: checkNickname
      description: 닉네임 중복 여부를 체크합니다.
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NicknameCheckRequestDto'
      responses:
        '200':
          description: 중복 여부 반환
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NicknameCheckResponseDto'
  /api/v1/users/me/agreePushNotification:
    post:
      summary: 푸시 알림 동의
      operationId: postPushNotificationAgreement
      description: 푸시 알림을 동의합니다.
      tags:
        - User
      responses:
        '200':
          description: 푸시 알림 동의 완료
  /api/v1/users/me/agreement:
    post:
      summary: 1. 약관동의 정보 등록
      operationId: postUserAgreement
      description: 사용자의 약관동의 정보를 등록합니다. 필수 등록 정보입니다.
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserAgreementDto'
      responses:
        '200':
          description: 등록 성공
  /api/v1/users/me/info:
    post:
      summary: 2. 사용자 개인정보 등록
      operationId: postUserInfo
      description: 사용자의 개인정보를 등록합니다. 필수 등록 정보입니다.
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInfoDto'
      responses:
        '200':
          description: 등록 성공
        '422':
          description: 등록 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
              examples:
                이전 단계 미완료:
                  $ref: '#/components/examples/Error_PreviousStepNotCompleted'
  /api/v1/users/me/checklist:
    post:
      summary: 3. 소비중독 체크리스트 정보 등록
      operationId: postChecklistInfo
      description: 소비중독 체크리스트 정보를 등록합니다. 필수 등록 정보입니다.
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserChecklistDto'
      responses:
        '200':
          description: 등록 성공
        '422':
          description: 등록 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
              examples:
                이전 단계 미완료:
                  $ref: '#/components/examples/Error_PreviousStepNotCompleted'
  /api/v1/users/me/habit:
    post:
      summary: 4. 소비습관 정보 등록
      operationId: postHabitInfo
      description: 소비습관 정보를 등록합니다. 필수 등록 정보입니다.
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserHabitDto'
      responses:
        '200':
          description: 등록 성공
        '422':
          description: 등록 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
              examples:
                이전 단계 미완료:
                  $ref: '#/components/examples/Error_PreviousStepNotCompleted'
                저축이 수입보다 높음:
                  $ref: '#/components/examples/Error_SavingIsGreaterThanIncome'
  /api/v1/users/me/pattern:
    post:
      summary: 5. 사용자 소비습관 패턴 등록
      operationId: postPatternInfo
      description: 사용자의 소비습관 패턴을 등록합니다. 필수 등록 요소가 아닙니다.
      tags:
        - User
      requestBody:
        required: true
        description: >
          입력 형식은 다음과 같습니다.<br><br>
          **primeUseDay**<br>
          다음 요소중 하나:
            - `MONDAY`
            - `TUESDAY`
            - `WEDNESDAY`
            - `THURSDAY`
            - `FRIDAY`
            - `SATURDAY`
            - `SUNDAY`

          **primeUseTime**<br>
          `hh:mm:ss` 형식의 스트링. 초 부분은 무시됩니다.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPatternDto'
      responses:
        '200':
          description: 등록 성공
        '422':
          description: 등록 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
              examples:
                이전 단계 미완료:
                  $ref: '#/components/examples/Error_PreviousStepNotCompleted'
  /api/v1/users/me/registrationToken:
    post:
      summary: 레지스트레이션 토큰 등록
      operationId: postRegistrationToken
      description: FCM 레지스트레이션 토큰을 등록합니다.
      tags: 
        - User
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationTokenRegisterDto'
      responses:
        '200':
          description: 토큰 등록 성공
        '422':
          description: 토큰 등록 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
              examples:
                이미 등록된 레지스트레이션 토큰:
                  $ref: '#/components/examples/Error_RegistrationTokenAlreadyRegistered'

  /api/v1/challenges:
    get:
      summary: 챌린지 목록 가져오기
      operationId: getChallenges
      description: >
        작심삼일 챌린지 목록을 가져옵니다.<br><br>
        정렬 순서는 개인화가 적용될 수 있습니다.
      tags:
        - Challenge
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/sizeParam'
      responses:
        '200':
          description: 챌린지 목록 반환
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedChallengeDto'
  /api/v1/challenges/{challengeId}:
    get:
      summary: 특정 챌린지 정보 가져오기
      operationId: getChallenge
      description: >
        특정 챌린지 정보를 가져옵니다.
      tags:
        - Challenge
      parameters:
        - $ref: '#/components/parameters/challengeIdParam'
      responses:
        '200':
          description: 특정 챌린지 정보 반환
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeDto"
        '422':
          description: 챌린지 정보 반환 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
              examples:
                존재하지 않는 챌린지:
                  $ref: '#/components/examples/Error_ChallengeNotExist'
  /api/v1/challenges/{challengeId}/enroll:
    post:
      summary: 챌린지 참여하기
      operationId: enrollChallenge
      description: >
        특정 ID의 챌린지에 참여합니다.<br><br>
        현재 챌린지 참여중이 아닐 경우, 3일간의 챌린지 기록(`ChallengeRecord`)가
        생성됩니다.<br><br>
        만약 오늘 성공한 챌린지 기록을 가지고 있을 경우(3일 챌린지가 종료되었을
        경우), 오늘부터가 아닌 내일부터 3일간 기록을 생성합니다.
      tags:
        - Challenge
      parameters:
        - $ref: '#/components/parameters/challengeIdParam'
      responses:
        '201':
          description: >
            챌린지 등록 완료<br><br>
            오늘 날짜부터 3일간 챌린지 기록이 생성됩니다.
        '422':
          description: 챌린지 등록 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
              examples:
                이미 참여중인 챌린지:
                  $ref: '#/components/examples/Error_AlreadyEnrolled'
                존재하지 않는 챌린지:
                  $ref: '#/components/examples/Error_ChallengeNotExist'
  /api/v1/challengeRecords:
    get:
      summary: 참여중인 챌린지 기록 목록 가져오기
      operationId: getChallengeRecords
      description: >
        내가 참여중인 챌린지의 특정 날의 기록들을 가져옵니다.<br><br>

        ### 챌린지 기록

        챌린지 기록은 처음 생성되면 WAIT 상태입니다.<br><br>
        오늘의 챌린지를 수행하거나 챌린지 수행 기간이 지나면 
        SUCCESS 또는 FAIL 상태로 바뀌게 됩니다.
      tags:
        - Challenge
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/sizeParam'
        - $ref: '#/components/parameters/dateParam'
        - name: status
          description: 필터링할 챌린지 상태입니다. 제공되지 않으면 모든 챌린지를 가져옵니다.
          in: query
          schema:
            $ref: '#/components/schemas/ChallengeRecordStatus'
      responses:
        '200':
          description: 챌린지 기록 리스트
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedChallengeRecordDto'
  /api/v1/challengeRecords/{challengeId}:
    get:
      summary: 참여중인 챌린지 기록 확인
      operationId: getChallengeRecord
      description: 참여중인 특정 챌린지의 특정 날짜의 기록을 가져옵니다.
      tags:
        - Challenge
      parameters:
        - $ref: '#/components/parameters/challengeIdParam'
        - $ref: '#/components/parameters/dateParam'
      responses:
        '200':
          description: 챌린지 기록 반환
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeRecordDto'
        '422':
          description: 챌린지 기록 확인 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
              examples:
                참여중이지 않은 챌린지:
                  $ref: '#/components/examples/Error_NotEnrolled'
                존재하지 않는 챌린지:
                  $ref: '#/components/examples/Error_ChallengeNotExist'
    delete:
      summary: 챌린지 취소하기
      operationId: cancelChallenge
      description: >
        참여중인 챌린지를 취소합니다.<br><br>
        챌린지를 취소할 경우 오늘을 포함한 미완료된 챌린지 기록들이 삭제됩니다.<br>
        이미 성공하거나 실패한 기록들은 삭제되지 않습니다.
      tags:
        - Challenge
      parameters:
        - name: challengeId
          description: 취소할 챌린지의 ID입니다.
          in: path
          required: true
          schema:
            type: integer
            format: int64
            default: 0
      responses:
        '200':
          description: >
            챌린지 취소 성공<br><br>
            오늘과 오늘 이후 남은 챌린지 기록들을 삭제합니다.
        '422':
          description: 챌린지 기록 삭제 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
              examples:
                참여중이지 않은 챌린지:
                  $ref: '#/components/examples/Error_NotEnrolled'
  /api/v1/challengeRecords/{challengeId}/check:
    post:
      summary: 오늘의 챌린지 기록 챌린지 체크
      operationId: checkChallenge
      description: 참여중인 챌린지의 오늘 기록을 완료로 체크합니다.
      tags:
        - Challenge
      parameters:
        - $ref: '#/components/parameters/challengeIdParam'
      responses:
        '200':
          description: 오늘의 챌린지 체크 성공. 체크된 챌린지 기록이 반환됩니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeRecordDto'
        '422':
          description: 챌린지 체크 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
              examples:
                참여중이지 않은 챌린지:
                  $ref: '#/components/examples/Error_NotEnrolled'
                존재하지 않는 챌린지:
                  $ref: '#/components/examples/Error_ChallengeNotExist'
                이미 완료한 챌린지:
                  $ref: '#/components/examples/Error_ChallengeAlreadyChecked'
  /api/v1/challengeStat/{challengeId}:
    get:
      summary: 특정 챌린지 참여 통계 확인
      operationId: getChallengeStat
      description: 특정 챌린지에 대한 내 참여 통계를 확인합니다.
      tags:
        - Challenge
      parameters:
        - $ref: '#/components/parameters/challengeIdParam'
      responses:
        '200':
          description: 챌린지 통계 반환 성공.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeStatDto'
        '422':
          description: 챌린지 통계 반환 실패.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
              examples:
                존재하지 않는 챌린지:
                  $ref: '#/components/examples/Error_ChallengeNotExist'
  /api/v1/challengeTripple/{challengeId}:
    get:
      summary: 3일치 작심삼일 기록 확인
      operationId: getChallengeTripple
      description: >
        오늘 도전중인 3일치 챌린지 정보를 가져옵니다.<br><br>
        `location` 필드는 오늘 챌린지 기록이 3일중 몇번째인지 나타내는 수입니다.<br>
        1, 2, 3이 가능합니다.<br><br>
        `duratoin`은 오늘이 며칠째 도전일인지를 나타냅니다.
      tags:
        - Challenge
      parameters:
        - $ref: '#/components/parameters/challengeIdParam'
      responses:
        '200':
          description: 3일치 챌린지 정보 반환
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeTrippleDto'
        '422':
          description: 3일치 챌린지 정보 반환 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
              examples:
                참여중이지 않은 챌린지:
                  $ref: '#/components/examples/Error_NotEnrolled'
                존재하지 않는 챌린지:
                  $ref: '#/components/examples/Error_ChallengeNotExist'
                이미 완료한 챌린지:
                  $ref: '#/components/examples/Error_ChallengeAlreadyChecked'

  /api/v1/challengeGroups:
    get:
      summary: 챌린지 그룹 목록 가져오기
      operationId: getChallengeGroups
      description: 챌린지 그룹 목록을 가져옵니다.
      tags:
        - ChallengeGroup
      parameters:
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/sizeParam'
        - name: search
          description: 검색할 챌린지의 제목 또는 해시태그입니다.
          in: query
          schema:
            type: string
            minimum: 1
            maximum: 100
        - name: created
          description: 내가 생성한 챌린지 그룹만 가져올지 여부입니다.
          in: query
          schema:
            type: boolean
            default: false
        - name: participating
          description: 참여중인 챌린지 그룹만 가져올지 여부입니다.
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 챌린지 그룹 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedChallengeGroupDto'
    post:
      summary: 챌린지 그룹 생성
      operationId: createChallengeGroup
      description: >
        새로운 챌린지 그룹을 생성합니다.<br><br>
        비밀방일 경우 패스워드가 필수입니다. 아닐 경우 패스워드는 무시됩니다.
      tags:
        - ChallengeGroup
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeGroupDto'
            examples:
              일반:
                $ref: '#/components/examples/ChallengeGroup_Form_Normal'
              비밀방:
                $ref: '#/components/examples/ChallengeGroup_Form_Hidden'
      responses:
        '201':
          description: 챌린지 그룹 생성 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeGroupDto'
        '422':
          description: 챌린지 그룹 생성 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
              examples:
                챌린지 이름 중복:
                  $ref: '#/components/examples/Error_ChallengeAlreadyExist'
  /api/v1/challengeGroups/{groupId}:
    get:
      summary: 특정 챌린지 그룹 정보 가져오기
      operationId: getChallengeGroup
      description: 특정 챌린지 그룹의 정보와 현재 순위를 가져옵니다.
      tags:
        - ChallengeGroup
      parameters:
        - $ref: '#/components/parameters/groupIdParam'
      responses:
        '200':
          description: 챌린지 그룹 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeGroupRankDto'
        '422':
          description: 챌린지 그룹 정보 확인 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
              examples:
                챌린지 그룹이 존재하지 않음:
                  $ref: '#/components/examples/Error_ChallengeNotExist'
    put:
      summary: 특정 챌린지 그룹 정보 수정
      operationId: updateChallengeGroup
      description: >
        특정 챌린지 그룹 정보를 수정합니다. 내가 만든 챌린지
        정보만 수정할 수 있습니다.
      tags:
        - ChallengeGroup
      parameters:
        - $ref: '#/components/parameters/groupIdParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeGroupDto'
            examples:
              일반:
                $ref: '#/components/examples/ChallengeGroup_Form_Modify'
      responses:
        '200':
          description: 챌린지 그룹 정보 수정 성공. 수정된 정보가 반환됩니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeGroupDto'
        '422':
          description: 챌린지 그룹 정보 삭제 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
              examples:
                챌린지 그룹이 존재하지 않음:
                  $ref: '#/components/examples/Error_ChallengeNotExist'
    delete:
      summary: 특정 챌린지 그룹 삭제
      operationId: deleteChallengeGroup
      description: >
        특정 챌린지 그룹을 삭제합니다. 내가 만든 챌린지만 삭제할
        수 있습니다.<br><br>

        **NOTE**: 내부적으로는 완전히 삭제되지 않고 삭제되었다고 표시만 됩니다.<br>
        그래서 챌린지 그룹 목록 조회에서는 등장하지 않지만, ID를 이용한 직접 조회는
        가능합니다.<br><br>

        **WARNNING**: 아직 챌린지 삭제 로직에 대한 논의가 더 필요해 보입니다.<br>
        추후에 얼마든지 로직이 바뀔 수 있습니다.
      tags:
        - ChallengeGroup
      parameters:
        - $ref: '#/components/parameters/groupIdParam'
      responses:
        '200':
          description: >
            챌린지 그룹 삭제 성공
        '422':
          description: 챌린지 그룹 정보 삭제 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
              examples:
                챌린지 그룹이 존재하지 않음:
                  $ref: '#/components/examples/Error_ChallengeNotExist'
  /api/v1/challengeGroups/{groupId}/enroll:
    post:
      summary: 챌린지 그룹 참여하기
      operationId: enrollChallengeGroup
      description: >
        특정 챌린지 그룹에 참여합니다.<br><br>
        챌린지 참여 로직과 동일합니다.
      tags:
        - ChallengeGroup
      parameters:
        - $ref: '#/components/parameters/groupIdParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeGroupEnrollmentDto'
      responses:
        '201':
          description: 챌린지 그룹 기록 생성 성공
        '422':
          description: 챌린지 그룹 참여 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
              examples:
                이미 참여중인 챌린지:
                  $ref: '#/components/examples/Error_AlreadyEnrolled'
                존재하지 않는 챌린지:
                  $ref: '#/components/examples/Error_ChallengeNotExist'
  /api/v1/challengeGroups/{groupId}/check:
    post:
      summary: 챌린지 그룹 기록 체크
      operationId: checkChallengeGroup
      description: 현재 로그인한 사용자의 특정 그룹의 오늘 기록을 체크합니다.
      tags:
        - ChallengeGroup
      parameters:
        - $ref: '#/components/parameters/groupIdParam'
      responses:
        '200':
          description: 체크 성공. 기록을 반환합니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeGroupRecordDto'
        '422':
          description: 챌린지 그룹 체크 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
              examples:
                참여중이지 않은 챌린지:
                  $ref: '#/components/examples/Error_NotEnrolled'
                존재하지 않는 챌린지:
                  $ref: '#/components/examples/Error_ChallengeNotExist'
                이미 완료한 챌린지:
                  $ref: '#/components/examples/Error_ChallengeAlreadyChecked'
  /api/v1/challengeGroups/{groupId}/tripple:
    get:
      summary: 챌린지 그룹 3일 기록
      operationId: getChallengeGroupTripple
      description: 챌린지 그룹의 3일치 기록을 가져옵니다.
      tags:
        - ChallengeGroup
      parameters:
        - $ref: '#/components/parameters/groupIdParam'
      responses:
        '200':
          description: 기록을 가져옵니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeGroupTrippleDto'
        '422':
          description: 챌린지 그룹 기록 확인 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDto'
              examples:
                참여중이지 않은 챌린지:
                  $ref: '#/components/examples/Error_NotEnrolled'
                존재하지 않는 챌린지:
                  $ref: '#/components/examples/Error_ChallengeNotExist'


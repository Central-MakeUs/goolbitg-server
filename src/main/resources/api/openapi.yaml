      in: query
      schema:
        type: integer
        default: 10
    challengeIdParam:
      name: challengeId
      description: 챌린지 아이디입니다.
      required: true
      in: path
      schema:
        type: integer
        format: int64
        example: 1
    groupIdParam:
      name: groupId
      description: 챌린지 그룹 아이디입니다.
      required: true
      in: path
      schema:
        type: integer
        format: int64
        example: 1
    postIdParam:
      name: postId 
      description: 살까말까 포스트 아이디입니다.
      in: path
      required: true
      schema:
        type: integer
        format: int64
        default: 1
    dateParam:
      name: date
      description: 기록을 확인할 날짜입니다. 제공되지 않으면 오늘 기록을 가져옵니다. yyyy-MM-dd 형식입니다.
      in: query
      schema:
        type: string
        format: date
        nullable: true
    chatLastIdParam:
      name: chatLastId
      description: 마지막으로 받은 채팅의 id입니다.
      in: query
      schema:
        type: integer
        format: int64
        example: 1

  requestBodies:
    RegisterReq:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthRequestDto'

  responses:
    NotFound:
      description: 컨텐츠를 찾을 수 없음
    BadRequest:
      description: 잘못된 요청 형식
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDto'
          examples:
            잘못된 입력 형식:
              $ref: '#/components/examples/Error_BadRequest'
    Unauthorized:
      description: 인증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDto'
          examples:
            잘못된 토큰:
              $ref: '#/components/examples/Error_TokenNotValid'
            만료된 토큰:
              $ref: '#/components/examples/Error_TokenExpired'
            인증 정보 없음:
              $ref: '#/components/examples/Error_AuthenticationEmpty'
    Forbidden:
      description: 요청 권한이 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDto'
          examples:
            사용자 정보 입력 미완료:
              $ref: '#/components/examples/Error_RegisterNotComplete'
            권한 없음:
              $ref: '#/components/examples/Error_NoAuthorzation'
            로그아웃된 유저:
              $ref: '#/components/examples/Error_LoggedOut'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []

tags:
  - name: ETC
    description: 기타
  - name: Auth
    description: 인증
  - name: User
    description: 유저
  - name: Challenge
    description: 작심삼일 챌린지
  - name: ChallengeGroup
    description: 작심삼일 챌린지 그룹
  - name: BuyOrNot
    description: 살까말까
  - name : Analysis
    description: 소비습관분석
  - name: Notice
    description: 알림
